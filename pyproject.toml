[project]
name = "barbai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bismarck Flores", email = "bismarckf555@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "llama-cpp-python>=0.3.35",
    "pydantic>=2.13.5",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
barbai = "barbai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
